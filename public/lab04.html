<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스킬투머니 실습실 · 4장</title>
  <!-- Pyodide CDN: 브라우저 안에서 파이썬 실행 -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <style>
    /* CSS Reset & Variables */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-deep-navy: #070D1E;
      --bg-navy-card: #0F1B3B;
      --bg-navy-light: #16244D;
      --bg-editor: #080E1E;
      --text-gold-main: #E5B842;
      --text-gold-light: #FDE08B;
      --gold-gradient: linear-gradient(135deg, #FFE895 0%, #E5B842 50%, #B8860B 100%);
      --text-white: #FFFFFF;
      --text-slate: #94A3B8;
      --text-slate-light: #CBD5E1;
      --border-gold: rgba(229, 184, 66, 0.3);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      --gold-glow: 0 0 25px rgba(229, 184, 66, 0.35);

      /* 피드백 색상 */
      --color-success: #4ADE80;
      --color-error: #F87171;
      --color-warning: #FB923C;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      background-color: var(--bg-deep-navy);
      color: var(--text-white);
      line-height: 1.6;
      word-break: keep-all;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(30, 58, 138, 0.22) 0%, transparent 40%),
        radial-gradient(circle at 90% 65%, rgba(229, 184, 66, 0.08) 0%, transparent 45%);
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* Gold Text Utilities */
    .gold-text {
      color: var(--text-gold-main);
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    .gold-glow-text {
      text-shadow: 0 2px 15px rgba(229, 184, 66, 0.4);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      border: none;
    }

    .btn-gold {
      background: var(--gold-gradient);
      color: #070D1E;
      box-shadow: 0 4px 18px rgba(229, 184, 66, 0.35);
    }

    .btn-gold:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(229, 184, 66, 0.5);
      filter: brightness(1.05);
    }

    .btn-outline {
      background: rgba(15, 27, 59, 0.7);
      border: 1px solid var(--border-gold);
      color: var(--text-gold-light);
    }

    .btn-outline:hover:not(:disabled) {
      background: rgba(229, 184, 66, 0.12);
      border-color: var(--text-gold-main);
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
      filter: grayscale(0.2);
    }

    /* 1. 상단 제목 띠 */
    .lab-topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 13, 30, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .lab-topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .lab-badge-chapter {
      background: rgba(229, 184, 66, 0.15);
      border: 1px solid var(--border-gold);
      color: var(--text-gold-light);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .lab-topbar-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lab-topbar-right a {
      font-size: 0.88rem;
      color: var(--text-slate-light);
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .lab-topbar-right a:hover {
      color: var(--text-gold-light);
      border-color: var(--border-gold);
      background: rgba(229, 184, 66, 0.08);
    }

    /* 2. 메인 실습실 레이아웃: 좌/우 반반 분할 */
    .lab-container {
      max-width: 1560px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    /* 패널 공통 */
    .lab-panel {
      background: var(--bg-navy-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      min-height: calc(100vh - 130px);
    }

    .panel-header {
      padding: 16px 22px;
      background: rgba(15, 27, 59, 0.8);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-title {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.3px;
    }

    .panel-pill {
      font-size: 0.76rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-slate);
    }

    .panel-body {
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* ===== 왼쪽: 원데이 강좌 목록 ===== */
    .webapp-frame {
      background: rgba(7, 13, 30, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 24px 20px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    /* 목록 헤더 영역 */
    .course-list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .course-list-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .btn-refresh {
      padding: 8px 16px;
      font-size: 0.88rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      background: rgba(15, 27, 59, 0.9);
      border: 1px solid var(--border-gold);
      color: var(--text-gold-light);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-refresh:hover:not(:disabled) {
      background: rgba(229, 184, 66, 0.12);
      border-color: var(--text-gold-main);
      transform: translateY(-1px);
    }

    .btn-refresh:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 카드 목록 컨테이너 */
    #course-card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 개별 강좌 카드 */
    .course-item-card {
      background: linear-gradient(145deg, #101c3d 0%, #0c152e 100%);
      border: 1.5px solid var(--border-gold);
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .course-item-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 16px rgba(229, 184, 66, 0.1);
    }

    .course-item-card.sold-out {
      opacity: 0.65;
      border-color: rgba(255, 255, 255, 0.1);
    }

    .course-item-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .course-item-name {
      font-size: 1.08rem;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .course-item-info {
      font-size: 0.88rem;
      color: var(--text-slate-light);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .course-item-price {
      color: var(--text-gold-light);
      font-weight: 700;
    }

    .course-item-seats {
      color: var(--text-slate);
    }

    /* 상태 배지 */
    .badge-soldout {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: 6px;
      background: rgba(148, 163, 184, 0.15);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #94A3B8;
      white-space: nowrap;
    }

    .badge-urgent {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: 6px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #F87171;
      white-space: nowrap;
    }

    /* 빈 목록 안내 */
    .course-list-empty {
      text-align: center;
      color: var(--text-slate);
      font-size: 0.92rem;
      padding: 32px 0;
    }

    /* ===== 오른쪽: 파이썬 코드 에디터 ===== */
    .editor-section {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 16px;
    }

    .editor-desc-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-slate);
      font-size: 0.85rem;
    }

    .editor-container {
      flex: 1;
      display: flex;
      background: var(--bg-editor);
      border: 1px solid rgba(229, 184, 66, 0.25);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
      min-height: 340px;
      position: relative;
    }

    .editor-line-numbers {
      width: 48px;
      padding: 16px 8px 16px 0;
      background: rgba(7, 13, 30, 0.7);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      color: #55667e;
      font-family: "Fira Code", Consolas, Monaco, "Courier New", monospace;
      font-size: 15px;
      line-height: 1.6;
      text-align: right;
      user-select: none;
      overflow: hidden;
      box-sizing: border-box;
    }

    .editor-textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #E2E8F0;
      font-family: "Fira Code", Consolas, Monaco, "Courier New", monospace;
      font-size: 15px;
      line-height: 1.6;
      padding: 16px;
      resize: none;
      white-space: pre;
      overflow-x: auto;
      overflow-y: auto;
      tab-size: 4;
      box-sizing: border-box;
    }

    .editor-textarea::selection {
      background: rgba(229, 184, 66, 0.3);
    }

    /* 버튼 및 상태/피드백 영역 */
    .editor-action-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .editor-btn-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-apply {
      padding: 12px 22px;
      font-size: 0.98rem;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    .btn-reset {
      padding: 12px 18px;
      font-size: 0.92rem;
      border-radius: 10px;
      white-space: nowrap;
    }

    .btn-colab-main {
      padding: 12px 18px;
      font-size: 0.92rem;
      border-radius: 10px;
      white-space: nowrap;
      border-color: rgba(249, 115, 22, 0.45);
      color: #FDBA74;
      background: rgba(249, 115, 22, 0.08);
      gap: 6px;
    }

    .btn-colab-main:hover {
      background: rgba(249, 115, 22, 0.18);
      border-color: #FB923C;
      color: #FFFFFF;
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.25);
    }

    /* 버튼 옆 상태 표시 (초록, 빨강, 주황 글씨) */
    .pyodide-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(15, 27, 59, 0.75);
      border: 1px solid var(--border-subtle);
      transition: all 0.25s ease;
      line-height: 1.4;
      flex: 1;
      min-width: 220px;
    }

    /* 준비 중 */
    .pyodide-status.loading {
      color: var(--text-gold-light);
      border-color: rgba(229, 184, 66, 0.35);
      background: rgba(229, 184, 66, 0.08);
    }

    /* 준비 완료 / 성공: 초록 글씨 */
    .pyodide-status.success {
      color: var(--color-success);
      border-color: rgba(74, 222, 128, 0.35);
      background: rgba(34, 197, 94, 0.12);
    }

    /* 오류: 빨간 글씨 */
    .pyodide-status.error {
      color: var(--color-error);
      border-color: rgba(248, 113, 113, 0.4);
      background: rgba(239, 68, 68, 0.12);
    }

    /* 웹앱 미연결 / 변화 없음: 주황 글씨 */
    .pyodide-status.warning {
      color: var(--color-warning);
      border-color: rgba(251, 146, 60, 0.45);
      background: rgba(249, 115, 22, 0.12);
    }

    .pyodide-status.running {
      color: var(--text-gold-light);
      border-color: var(--border-gold);
    }

    .status-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(229, 184, 66, 0.25);
      border-top-color: var(--text-gold-main);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 코랩 다운로드 인라인 버튼 */
    .btn-colab {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(249, 115, 22, 0.25);
      border: 1px solid rgba(249, 115, 22, 0.65);
      color: #FED7AA;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 0 4px;
      vertical-align: middle;
      text-decoration: none;
    }

    .btn-colab:hover {
      background: rgba(249, 115, 22, 0.4);
      border-color: #FB923C;
      color: #FFFFFF;
      transform: translateY(-1px);
    }

    .var-badge {
      display: inline-block;
      background: rgba(251, 146, 60, 0.2);
      border: 1px solid rgba(251, 146, 60, 0.5);
      color: #FFEDD5;
      padding: 1px 7px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: 700;
      margin: 0 2px;
    }

    .apply-tip {
      font-size: 0.82rem;
      color: var(--text-slate);
    }

    /* 반응형 스타일 */
    @media (max-width: 960px) {
      .lab-container {
        grid-template-columns: 1fr;
        padding: 16px;
        gap: 20px;
      }

      .lab-panel {
        min-height: auto;
      }

      .editor-container {
        min-height: 280px;
      }

      .btn-apply, .btn-reset {
        flex: 1;
        justify-content: center;
      }

      .pyodide-status {
        width: 100%;
        min-width: auto;
      }
    }

    @media (max-width: 640px) {
      .lab-topbar {
        padding: 12px 16px;
      }

      .lab-topbar-title {
        font-size: 1.08rem;
      }

      .course-item-card {
        padding: 14px 16px;
      }
    }
  </style>
</head>
<body>

  <!-- 맨 위 제목 띠: 스킬투머니 실습실 · 4장 -->
  <header class="lab-topbar">
    <div class="lab-topbar-left">
      <span class="lab-badge-chapter">실습 환경</span>
      <h1 class="lab-topbar-title">
        <span class="gold-text">스킬투머니 실습실 · 4장</span>
      </h1>
    </div>
    <div class="lab-topbar-right">
      <a href="index.html" title="메인 페이지로 이동">
        <span>← 메인 화면 보기</span>
      </a>
    </div>
  </header>

  <!-- 메인 실습실 컨테이너 (좌: 웹앱 화면 / 우: 파이썬 코드) -->
  <main class="lab-container">
    
    <!-- 왼쪽: 원데이 강좌 목록 -->
    <section class="lab-panel">
      <div class="panel-header">
        <div class="panel-title">
          <span>🖥️</span>
          <span>웹앱 화면</span>
        </div>
        <span class="panel-pill">미리보기</span>
      </div>

      <div class="panel-body">
        <div class="webapp-frame">
          <!-- 목록 헤더 -->
          <div class="course-list-header">
            <h2 class="course-list-title">원데이 강좌 목록</h2>
            <button type="button" id="btn-refresh" class="btn-refresh" disabled>
              🔄 목록 새로 고침
            </button>
          </div>

          <!-- 카드가 쌓이는 자리 -->
          <div id="course-card-list">
            <div class="course-list-empty">파이썬을 준비하고 있습니다...</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 오른쪽: 이 웹앱을 움직이는 파이썬 코드 -->
    <section class="lab-panel">
      <div class="panel-header">
        <div class="panel-title">
          <span>🐍</span>
          <span>이 웹앱을 움직이는 파이썬 코드</span>
        </div>
        <span class="panel-pill">Python 3</span>
      </div>

      <div class="panel-body">
        <div class="editor-section">
          <div class="editor-desc-bar">
            <span>실행 로직 에디터 (main.py)</span>
            <span>UTF-8</span>
          </div>

          <!-- 코드 칸: 어두운 배경, 고정폭 글꼴, 왼쪽에 줄 번호 -->
          <div class="editor-container">
            <div id="line-numbers" class="editor-line-numbers"></div>
            <textarea id="code-editor" class="editor-textarea" spellcheck="false">names = ["AI 자동화", "숏폼 편집", "엑셀 실무"]
prices = [35000, 45000, 30000]
seats = [8, 6, 10]
booked = [8, 2, 7]
for i in range(0, 3, 1):
    left = seats[i] - booked[i]
    if left == 0:
        state = "[마감]"
    elif left <= 2:
        state = "[마감 임박]"
    else:
        state = ""
    print(names[i], prices[i], "원 / 남은 자리", left, "석", state)</textarea>
          </div>

          <!-- 버튼 및 피드백 상태 영역 -->
          <div class="editor-action-wrap">
            <div class="editor-btn-row">
              <button type="button" id="btn-apply" class="btn btn-gold btn-apply" disabled>
                ▶ 웹앱에 적용하기
              </button>
              <button type="button" id="btn-reset" class="btn btn-outline btn-reset" title="처음 작성된 파이썬 코드로 되돌립니다">
                처음 코드로
              </button>
              <button type="button" id="btn-colab-download" class="btn btn-outline btn-colab-main" title="코랩 노트북(.ipynb) 파일로 다운로드합니다">
                ⬇ 코랩 노트북(.ipynb)으로 받기
              </button>
              <div id="pyodide-status" class="pyodide-status loading">
                <span class="status-spinner"></span>
                <span id="status-text">파이썬을 준비하고 있습니다...</span>
              </div>
            </div>
            <div class="apply-tip">💡 작성한 파이썬 코드의 print( ) 출력이 왼쪽 웹앱의 강좌 카드로 그려집니다.</div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- 스크립트: Pyodide 로드, 에디터 및 웹앱 양방향 연동, 스마트 에러/피드백 처리 -->
  <script>
    // 처음 기본 코드 정의
    const INITIAL_CODE = `names = ["AI 자동화", "숏폼 편집", "엑셀 실무"]
prices = [35000, 45000, 30000]
seats = [8, 6, 10]
booked = [8, 2, 7]
for i in range(0, 3, 1):
    left = seats[i] - booked[i]
    if left == 0:
        state = "[마감]"
    elif left <= 2:
        state = "[마감 임박]"
    else:
        state = ""
    print(names[i], prices[i], "원 / 남은 자리", left, "석", state)`;

    // HTML 이스케이프 유틸리티
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 전역 상태
    let pyodideInstance = null;
    let outputLines = [];

    // DOM 요소 캐싱
    const codeEditor = document.getElementById('code-editor');
    const lineNumbers = document.getElementById('line-numbers');
    const btnApply = document.getElementById('btn-apply');
    const btnReset = document.getElementById('btn-reset');
    const btnRefresh = document.getElementById('btn-refresh');
    const btnColabDownload = document.getElementById('btn-colab-download');
    const statusEl = document.getElementById('pyodide-status');
    const statusText = document.getElementById('status-text');
    const statusSpinner = statusEl.querySelector('.status-spinner');
    const courseCardList = document.getElementById('course-card-list');

    // print( ) 콜백: 한 줄씩 outputLines에 쌓음
    window.pyCustomPrint = function(msg) {
      outputLines.push(String(msg));
    };

    // print( ) 출력 한 줄을 강좌 카드 한 장으로 파싱해서 렌더링
    function renderCourseCards(lines) {
      if (lines.length === 0) {
        courseCardList.innerHTML = '<div class="course-list-empty">출력 결과가 없습니다.</div>';
        return;
      }

      const html = lines.map(line => {
        // 패턴: "강좌이름 가격 원 / 남은 자리 N 석 [상태]"
        // 맨 앞 단어(들)를 강좌 이름, 나머지를 정보로 분리
        // [마감] 또는 [마감 임박] 감지
        const isSoldOut   = line.includes('[마감]') && !line.includes('[마감 임박]');
        const isUrgent    = line.includes('[마감 임박]');

        // 강좌 이름: 첫 토큰(숫자가 나오기 전까지)
        const priceSplit = line.match(/^([\s\S]+?)\s+(\d[\d,]*)\s*원\s*\/\s*남은 자리\s*(\d+)\s*석/);
        let nameHtml  = '';
        let infoHtml  = '';

        if (priceSplit) {
          const rawName = priceSplit[1].trim();
          const price   = Number(priceSplit[2].replace(/,/g, '')).toLocaleString();
          const left    = priceSplit[3];

          nameHtml = `<span class="course-item-name">${escapeHtml(rawName)}</span>`;
          infoHtml = `<span class="course-item-price">${price}원</span>
                      <span class="course-item-seats">남은 자리 ${escapeHtml(left)}석</span>`;
        } else {
          // 파싱 실패 시 줄 전체를 이름으로
          nameHtml = `<span class="course-item-name">${escapeHtml(line)}</span>`;
        }

        // 상태 배지
        let badgeHtml = '';
        if (isSoldOut) {
          badgeHtml = `<span class="badge-soldout">마감</span>`;
        } else if (isUrgent) {
          badgeHtml = `<span class="badge-urgent">마감 임박</span>`;
        }

        const cardClass = isSoldOut ? 'course-item-card sold-out' : 'course-item-card';
        return `
          <div class="${cardClass}">
            <div class="course-item-left">
              ${nameHtml}
              <div class="course-item-info">${infoHtml}</div>
            </div>
            ${badgeHtml}
          </div>`;
      }).join('');

      courseCardList.innerHTML = html;
    }

    // 에디터 줄 번호 갱신
    function updateLineNumbers() {
      const lines = codeEditor.value.split('\n').length;
      let numberStr = '';
      for (let i = 1; i <= Math.max(lines, 1); i++) {
        numberStr += i + '<br>';
      }
      lineNumbers.innerHTML = numberStr;
    }

    codeEditor.addEventListener('input', () => {
      updateLineNumbers();
    });

    codeEditor.addEventListener('scroll', () => {
      lineNumbers.scrollTop = codeEditor.scrollTop;
    });

    // Tab 키 누를 때 4칸 공백 삽입
    codeEditor.addEventListener('keydown', function(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = this.selectionStart;
        const end = this.selectionEnd;
        this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
        this.selectionStart = this.selectionEnd = start + 4;
        updateLineNumbers();
      }
    });

    // [⬇ 코랩 노트북(.ipynb)으로 받기] 다운로드 함수
    window.downloadColabNotebook = function() {
      const code = codeEditor.value;
      const ipynb = {
        nbformat: 4,
        nbformat_minor: 2,
        metadata: {
          language_info: { name: "python" },
          colab: { name: "ch04_lab.ipynb" }
        },
        cells: [
          {
            cell_type: "markdown",
            metadata: {},
            source: [
              "4장 실습실에서 고친 코드입니다. 셀을 실행하면 강좌 목록이 출력됩니다."
            ]
          },
          {
            cell_type: "code",
            execution_count: null,
            metadata: {},
            outputs: [],
            source: code.split('\n').map((l, i, arr) => i < arr.length - 1 ? l + '\n' : l)
          }
        ]
      };

      const blob = new Blob([JSON.stringify(ipynb, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ch04_lab.ipynb';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      // 내려받은 뒤 안내 메시지 표시
      statusEl.className = 'pyodide-status success';
      if (statusSpinner) statusSpinner.style.display = 'none';
      statusText.innerHTML = '<span>✔ ch04_lab.ipynb를 내려받았습니다. 코랩 [파일] → [노트북 업로드]로 여세요.</span>';
    };

    // 파이썬 에러 분석 및 한국어 안내 생성
    function parsePythonError(errStr) {
      let lineNo = null;
      const lineMatches = [...errStr.matchAll(/line\s+(\d+)/g)];
      if (lineMatches.length > 0) {
        lineNo = lineMatches[lineMatches.length - 1][1];
      }

      let errorType = "ExecutionError";
      const typeMatch = errStr.match(/\b(SyntaxError|IndentationError|NameError|TypeError|ValueError|ModuleNotFoundError|ImportError|ZeroDivisionError|IndexError|KeyError)\b/);
      if (typeMatch) {
        errorType = typeMatch[1];
      }

      const linePrefix = lineNo ? `${lineNo}번째 줄 ` : "";
      let message = "";

      switch (errorType) {
        case "SyntaxError":
          message = `${linePrefix}문법 오류: 따옴표나 괄호가 빠지지 않았는지 확인하세요`;
          break;
        case "NameError":
          message = `${linePrefix}이름 오류: 변수 이름의 철자가 맞는지 확인하세요`;
          break;
        case "TypeError":
          message = `${linePrefix}자료형 오류: 글자와 숫자를 잘못 계산하지 않았는지 확인하세요`;
          break;
        case "ValueError":
          message = `${linePrefix}값 오류: 숫자로 바꿀 수 없는 글자가 들어왔는지 확인하세요`;
          break;
        case "IndentationError":
          message = `${linePrefix}들여쓰기 오류: 줄 앞부분의 띄어쓰기(들여쓰기)를 확인하세요`;
          break;
        case "ModuleNotFoundError":
        case "ImportError":
          message = `${linePrefix}모듈 오류: 이 실습실에서 쓸 수 없는 모듈입니다`;
          break;
        default:
          message = `${linePrefix}실행 오류: 코드 내용을 다시 확인해 보세요`;
          break;
      }

      return { lineNo, errorType, message };
    }

    // 파이썬 코드 실행 핵심 함수
    async function runPythonCode(options = {}) {
      if (!pyodideInstance) {
        alert("파이썬을 준비하고 있습니다. 잠시만 기다려 주세요.");
        return;
      }

      // 상태를 '실행 중'으로 표시
      statusEl.className = 'pyodide-status running';
      if (statusSpinner) statusSpinner.style.display = 'inline-block';
      statusText.textContent = '파이썬 실행 중...';
      btnApply.disabled = true;
      btnRefresh.disabled = true;

      outputLines = [];

      const code = codeEditor.value;

      try {
        await pyodideInstance.runPythonAsync(code);

        // print( ) 출력을 카드로 렌더링
        renderCourseCards(outputLines);

        // 성공 안내
        if (statusSpinner) statusSpinner.style.display = 'none';
        statusEl.className = 'pyodide-status success';
        statusText.innerHTML = '<span>✔ 파이썬 코드가 웹앱에 적용되었습니다.</span>';

      } catch (err) {
        console.error("Python Execution Error:", err);
        const errStr = err.message || String(err);
        const parsed = parsePythonError(errStr);

        if (parsed.errorType === 'ModuleNotFoundError' || parsed.errorType === 'ImportError') {
          statusEl.className = 'pyodide-status warning';
          if (statusSpinner) statusSpinner.style.display = 'none';
          statusText.innerHTML = `
            <span>코드는 바르게 실행되었지만 왼쪽 웹앱에서 달라진 것이 없습니다. 파이썬 문법이 틀린 것이 아니라, 이 실습실에서 그 부분이 웹앱과 연결되어 있지 않을 뿐입니다.
            <button type="button" class="btn-colab" onclick="downloadColabNotebook()">⬇ 코랩 노트북으로 받기</button>로 코드를 받아 코랩에서 실행해 결과를 확인해 보세요. (실습실 미지원 모듈 import)</span>
          `;
        } else {
          statusEl.className = 'pyodide-status error';
          if (statusSpinner) statusSpinner.style.display = 'none';
          statusText.innerHTML = `<span>⚠️ ${escapeHtml(parsed.message)}</span>`;
        }
      } finally {
        btnApply.disabled = false;
        btnRefresh.disabled = false;
        btnReset.disabled = false;
      }
    }

    // [처음 코드로] 버튼 핸들러
    btnReset.addEventListener('click', function() {
      codeEditor.value = INITIAL_CODE;
      updateLineNumbers();
      runPythonCode({ isReset: true });
    });

    // [목록 새로 고침] 버튼 핸들러
    btnRefresh.addEventListener('click', function() {
      runPythonCode();
    });

    // [⬇ 코랩 노트북(.ipynb)으로 받기] 버튼 핸들러
    if (btnColabDownload) {
      btnColabDownload.addEventListener('click', window.downloadColabNotebook);
    }

    // 실행 트리거 연결
    btnApply.addEventListener('click', () => runPythonCode());

    // Pyodide 초기화 로직
    async function initPyodide() {
      try {
        statusEl.className = 'pyodide-status loading';
        statusText.textContent = '파이썬을 준비하고 있습니다...';
        btnApply.disabled = true;
        btnRefresh.disabled = true;
        btnReset.disabled = true;

        pyodideInstance = await loadPyodide({
          indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"
        });

        // 파이썬 builtins.print 브라우저 UI 후킹
        await pyodideInstance.runPythonAsync(`
import builtins
import js

def _custom_print(*args, **kwargs):
    sep = kwargs.get('sep', ' ')
    end = kwargs.get('end', '\\n')
    text = sep.join(str(a) for a in args)
    js.pyCustomPrint(text)

builtins.print = _custom_print
        `);

        // 초기 실행으로 카드 그리기
        await runPythonCode({ isInit: true });

      } catch (err) {
        console.error("Pyodide 초기화 실패:", err);
        statusEl.className = 'pyodide-status error';
        if (statusSpinner) statusSpinner.style.display = 'none';
        statusText.innerHTML = `<span>⚠️ 파이썬 환경을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.</span>`;
        courseCardList.innerHTML = '<div class="course-list-empty">파이썬 환경을 불러오지 못했습니다.</div>';
      }
    }

    // 시작
    updateLineNumbers();
    initPyodide();
  </script>
</body>
